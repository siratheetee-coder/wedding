<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ค้นหาโต๊ะของคุณ</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #faf8f5;
      --beige: #f0ebe3;
      --border: #e0d5c8;
      --accent: #8b6e5a;
      --accent-dark: #6b5144;
      --text: #2c2c2c;
      --text-muted: #7a7268;
      --gold: #a07a2c;
    }
    body { font-family: 'Sarabun', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    header { text-align: center; margin-bottom: 22px; }
    header .eyebrow { font-size: 0.75rem; letter-spacing: 0.3em; color: var(--text-muted); text-transform: uppercase; }
    header h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 2rem; margin: 6px 0 4px; }
    header p { color: var(--text-muted); font-size: 0.9rem; }
    .search { position: sticky; top: 0; z-index: 5; background: var(--cream); padding: 8px 0 10px; }
    .search input { width: 100%; padding: 14px 16px; font-size: 1.1rem; font-family: inherit; border: 1px solid var(--border); border-radius: 4px; background: white; }
    .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #8b6e5a22; }
    .status { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 18px 8px; line-height: 1.7; }
    .results { display: flex; flex-direction: column; gap: 8px; }
    .res { display: flex; align-items: center; gap: 12px; background: white; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
    .res:hover, .res.active { border-color: var(--accent); }
    .res .who { flex: 1; min-width: 0; }
    .res .name { font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; }
    .res .meta { font-size: 0.78rem; color: var(--text-muted); }
    .res .tbl { text-align: center; min-width: 72px; }
    .res .tbl b { display: block; font-family: 'Playfair Display', serif; font-weight: 500; font-size: 1.6rem; line-height: 1; color: var(--accent); }
    .res .tbl b.vip { color: var(--gold); font-size: 1.25rem; }
    .res .tbl small { font-size: 0.7rem; color: var(--text-muted); }
    .res .tbl .none { font-size: 0.75rem; color: var(--text-muted); }

    /* Mini floor plan */
    .card { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 14px 12px; margin-top: 16px; }
    .card h2 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 1.25rem; text-align: center; }
    .card .sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 2px 0 12px; }
    .stage { text-align: center; font-size: 0.7rem; letter-spacing: 0.3em; color: var(--text-muted); background: var(--beige); border-radius: 3px; padding: 5px; margin-bottom: 8px; }
    .vip-row { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .sides { display: flex; gap: 0; }
    .side { flex: 1; display: grid; gap: 3px; align-content: start; }
    .aisle { width: 16px; margin: 0 4px; border-left: 1px dashed var(--border); border-right: 1px dashed var(--border); }
    .t { aspect-ratio: 1; border-radius: 50%; background: var(--beige); border: 1px solid #ddd3c6; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; color: var(--text-muted); min-width: 0; }
    .vip-row .t { width: 30px; border-color: #d4b26a; background: #fffaf0; }
    .t.on { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; transform: scale(1.35); box-shadow: 0 0 0 4px #8b6e5a33; position: relative; z-index: 1; animation: pulse 1.6s ease-in-out infinite; }
    .vip-row .t.on { background: var(--gold); border-color: var(--gold); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 9px #8b6e5a11; } }
    .legend { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted); margin-top: 6px; }
    .mates { margin-top: 12px; font-size: 0.85rem; color: var(--text-muted); text-align: center; line-height: 1.6; }
    footer { text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Wedding · Seating</div>
      <h1>ค้นหาโต๊ะของคุณ</h1>
      <p>พิมพ์ชื่อ ชื่อเล่น หรือชื่อกลุ่มของคุณ</p>
    </header>
    <div class="search"><input id="q" type="search" placeholder="เช่น ชื่อเล่น หรือ ชื่อหน่วยงาน" autocomplete="off" autofocus /></div>
    <div class="results" id="results"></div>
    <div class="status" id="status">กำลังโหลดผังที่นั่ง…</div>
    <div id="detail"></div>
    <footer>หากไม่พบชื่อ กรุณาติดต่อโต๊ะลงทะเบียนหน้างาน</footer>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let plan = null, picked = null;

  // Same numbering as the seating planner: VIP tables and regular tables are each
  // numbered by position; regular tables split into a left and right side.
  function prepare(s) {
    const list = Array.isArray(s.tableList) ? s.tableList
      : Array.from({ length: s.tableCount || 90 }, (_, i) => ({ id: i + 1, vip: false }));
    const vip = list.filter((t) => t.vip), reg = list.filter((t) => !t.vip);
    const label = {};
    vip.forEach((t, i) => (label[t.id] = { short: `VIP ${i + 1}`, vip: true }));
    reg.forEach((t, i) => (label[t.id] = { short: String(i + 1), vip: false }));
    const L = Object.assign({ perRow: 5, left: null }, s.layout);
    const leftN = Math.min(reg.length, L.left ?? Math.ceil(reg.length / 2));
    return { guests: s.guests || [], vip, left: reg.slice(0, leftN), right: reg.slice(leftN), cols: Math.max(1, L.perRow), label };
  }

  async function load() {
    try {
      const res = await fetch('/api/seating', { cache: 'no-store' });
      const { seating } = await res.json();
      if (!seating) throw new Error('empty');
      const keep = picked && (picked.id || picked.name);
      plan = prepare(seating);
      $('status').textContent = '';
      search();
      // Keep the guest's result open across background refreshes
      const again = keep && plan.guests.find((g) => (g.id || g.name) === keep);
      if (again) show(again, false);
    } catch {
      if (!plan) $('status').textContent = 'ยังโหลดผังที่นั่งไม่ได้ กรุณาลองใหม่อีกครั้ง หรือติดต่อโต๊ะลงทะเบียน';
    }
  }

  // Matched without spaces; a title typed in front ("พี่ต่าย", "คุณสมชาย") is optional
  const TITLE = /^(คุณ|นางสาว|นาง|นาย|ดร\.|อ\.|พี่|น้อง)/;
  const norm = (x) => String(x || '').toLowerCase().replace(/\s+/g, '');
  function search() {
    if (!plan) return;
    const raw = $('q').value.trim();
    picked = null;
    $('detail').innerHTML = '';
    if (!raw) { $('results').innerHTML = ''; $('status').textContent = ''; return; }
    const q = norm(raw), qBare = q.replace(TITLE, '') || q;
    const score = (g) => {
      const n = norm(g.name), grp = norm(g.group);
      if (n === q) return 0;
      if (n.startsWith(q)) return 1;
      if (n.includes(q)) return 2;
      if (n.includes(qBare)) return 3;
      if (grp.includes(q)) return 4;
      return -1;
    };
    const hits = plan.guests.map((g) => [score(g), g]).filter(([s]) => s >= 0)
      .sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, 'th')).slice(0, 30).map(([, g]) => g);
    $('status').textContent = hits.length ? '' : 'ไม่พบชื่อนี้ ลองพิมพ์ชื่อเล่น หรือชื่อกลุ่ม/หน่วยงาน';
    $('results').innerHTML = hits.map((g, i) => {
      const l = g.table != null && plan.label[g.table];
      return `<button class="res" data-i="${i}">
        <div class="who"><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.group || '')}${g.count > 1 ? ` · ${g.count} ท่าน` : ''}</div></div>
        <div class="tbl">${l ? `<small>${l.vip ? 'โต๊ะ' : 'โต๊ะที่'}</small><b class="${l.vip ? 'vip' : ''}">${esc(l.short)}</b>` : '<span class="none">ยังไม่ได้จัดโต๊ะ<br>ติดต่อหน้างาน</span>'}</div>
      </button>`;
    }).join('');
    $('results').onclick = (e) => {
      const b = e.target.closest('.res');
      if (!b) return;
      document.querySelectorAll('.res.active').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      show(hits[+b.dataset.i]);
    };
    if (hits.length === 1) show(hits[0]);
  }

  function show(g, scroll = true) {
    picked = g;
    const l = g.table != null && plan.label[g.table];
    if (!l) { $('detail').innerHTML = ''; return; }
    const t = (x) => `<div class="t${x.id === g.table ? ' on' : ''}">${esc(plan.label[x.id].short.replace('VIP ', 'V'))}</div>`;
    const mates = plan.guests.filter((x) => x.table === g.table && x !== g).map((x) => x.name);
    const side = plan.left.some((x) => x.id === g.table) ? 'ฝั่งซ้าย' : plan.right.some((x) => x.id === g.table) ? 'ฝั่งขวา' : 'แถวหน้าสุด (VIP)';
    $('detail').innerHTML = `
      <div class="card">
        <h2>${l.vip ? '' : 'โต๊ะที่ '}${esc(l.short)}</h2>
        <div class="sub">${esc(g.name)} · ${side} (หันหน้าเข้าเวที)</div>
        <div class="stage">เวที</div>
        ${plan.vip.length ? `<div class="vip-row">${plan.vip.map(t).join('')}</div>` : ''}
        <div class="sides">
          <div class="side" style="grid-template-columns:repeat(${plan.cols},1fr)">${plan.left.map(t).join('')}</div>
          <div class="aisle"></div>
          <div class="side" style="grid-template-columns:repeat(${plan.cols},1fr)">${plan.right.map(t).join('')}</div>
        </div>
        <div class="legend"><span>ฝั่งซ้าย</span><span>ทางเดิน</span><span>ฝั่งขวา</span></div>
        ${mates.length ? `<div class="mates">นั่งร่วมโต๊ะกับ: ${mates.slice(0, 8).map(esc).join(', ')}${mates.length > 8 ? ' …' : ''}</div>` : ''}
      </div>`;
    if (scroll) $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  let timer;
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 150); });
  // Pick up last-minute changes if the page stays open (e.g. on a kiosk)
  setInterval(load, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
