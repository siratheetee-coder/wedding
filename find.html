<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#faf8f5" />
  <title>ค้นหาโต๊ะของคุณ — Madchimapon &amp; Sirathee</title>
  <link rel="icon" type="image/png" href="assets/logo-sm.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Same tokens as the wedding site (index.html) */
    :root {
      --cream: #faf8f5;
      --beige: #f0ebe3;
      --border: #e0d5c8;
      --border-soft: #ebe1d1;
      --accent: #8b6e5a;
      --accent-soft: #b08968;
      --accent-dark: #6b5144;
      --accent-ink: #5a4128;
      --gold: #a07a2c;
      --text: #2c2c2c;
      --text-muted: #7a7268;
      --white: #ffffff;
      --shadow-sm: 0 2px 8px rgba(60, 40, 25, 0.06);
      --shadow-md: 0 8px 24px rgba(60, 40, 25, 0.1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Sarabun', sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 50% -120px, #fff 0%, rgba(255,255,255,0) 70%),
        linear-gradient(180deg, var(--cream) 0%, #f6f1ea 100%);
      background-attachment: fixed;
    }
    .wrap { max-width: 540px; margin: 0 auto; padding: 28px 18px calc(48px + env(safe-area-inset-bottom)); }

    /* ── Header ── */
    header { text-align: center; padding-top: 8px; animation: rise 0.8s var(--ease-out) both; }
    .logo { width: 96px; height: auto; display: block; margin: 0 auto 10px; filter: drop-shadow(0 4px 14px rgba(138, 106, 79, 0.2)); }
    .names { font-family: 'Playfair Display', serif; font-size: 1.05rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-ink); }
    .date { font-size: 0.7rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; }
    .divider { width: 40px; height: 1px; background: var(--accent); margin: 18px auto; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; transform: translateY(-50%); }
    .divider::before { left: -10px; }
    .divider::after { right: -10px; }
    h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(1.9rem, 8vw, 2.4rem); line-height: 1.15; color: var(--text); }
    h1 em { display: block; font-size: 0.5em; font-style: italic; color: var(--accent); letter-spacing: 0.06em; margin-top: 4px; }
    .lead { color: var(--text-muted); font-size: 0.92rem; margin-top: 10px; line-height: 1.6; }

    /* ── Search ── */
    .search { position: sticky; top: 0; z-index: 10; padding: 18px 0 12px; margin: 0 -18px; padding-left: 18px; padding-right: 18px;
      background: linear-gradient(180deg, var(--cream) 78%, rgba(250,248,245,0)); animation: rise 0.8s var(--ease-out) 0.1s both; }
    .field { position: relative; }
    .field svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--accent-soft); pointer-events: none; }
    .field input {
      width: 100%; padding: 16px 48px 16px 50px; font: 400 1.08rem 'Sarabun', sans-serif; color: var(--text);
      background: var(--white); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; appearance: none;
    }
    .field input::placeholder { color: #b0a698; }
    .field input:focus { outline: none; border-color: var(--accent-soft); box-shadow: 0 0 0 4px rgba(139, 110, 90, 0.12), var(--shadow-md); }
    .field input::-webkit-search-cancel-button { display: none; }
    .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--beige); color: var(--accent-dark); font-size: 1rem; cursor: pointer; display: none; }
    .field.has .clear { display: block; }

    /* ── Results ── */
    .results { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .res {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
      background: var(--white); border: 1px solid var(--border-soft); border-radius: 14px; padding: 14px 14px 14px 18px;
      box-shadow: var(--shadow-sm); transition: transform 0.2s var(--ease-out), box-shadow 0.2s, border-color 0.2s;
      animation: rise 0.45s var(--ease-out) both;
    }
    .res:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .res.active { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(139, 110, 90, 0.12), var(--shadow-md); }
    .res .who { flex: 1; min-width: 0; }
    .res .name { font-size: 1.02rem; font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; }
    .res .meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; overflow-wrap: anywhere; }
    .badge { flex-shrink: 0; width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--border); background: var(--cream);
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
    .badge small { font-size: 0.58rem; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 3px; }
    .badge b { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 1.55rem; color: var(--accent-dark); }
    .badge.vip { border-color: #d9be85; background: #fffaf0; }
    .badge.vip b { color: var(--gold); font-size: 1.05rem; }
    .badge.none { border-style: dashed; }
    .badge.none span { font-size: 0.62rem; color: var(--text-muted); text-align: center; line-height: 1.3; padding: 0 4px; }

    .status { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 26px 12px; line-height: 1.7; }
    .status .orn { display: block; color: var(--accent-soft); letter-spacing: 0.5em; margin-bottom: 8px; }
    .hint-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
    .hint-chips span { font-size: 0.75rem; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; background: var(--white); color: var(--accent-dark); }

    /* ── Table detail ── */
    .card { position: relative; background: var(--white); border: 1px solid var(--border-soft); border-radius: 20px; padding: 28px 18px 22px; margin-top: 18px; box-shadow: var(--shadow-md); animation: rise 0.6s var(--ease-out) both; overflow: hidden; }
    .card::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--border-soft); border-radius: 14px; pointer-events: none; }
    .card > * { position: relative; }
    .eyebrow { text-align: center; font-size: 0.68rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--text-muted); }
    /* Round table with eight seats, like the planner */
    .table-hero { position: relative; width: 168px; height: 168px; margin: 14px auto 10px; }
    .table-hero .seat { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--beige); border: 1px solid var(--border); }
    .table-hero .seat.you { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px rgba(139,110,90,0.15); }
    .table-hero .top { position: absolute; inset: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff, #f7f1e9); border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 7px var(--border-soft); }
    .table-hero .top small { font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-muted); }
    .table-hero .top b { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 2.9rem; line-height: 1; color: var(--accent-dark); }
    .table-hero.vip .top b { color: var(--gold); font-size: 1.9rem; }
    .who-line { text-align: center; font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; }
    .where { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
    .tname { text-align: center; margin-top: 6px; }
    .tname span { display: inline-block; font-size: 0.75rem; border-radius: 999px; padding: 3px 12px; background: var(--beige); color: var(--accent-dark); }

    .room { margin: 22px 0 4px; padding: 14px 10px 10px; background: var(--cream); border-radius: 12px; }
    .room-title { text-align: center; font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
    .stage { text-align: center; font-size: 0.66rem; letter-spacing: 0.4em; color: var(--accent-dark); background: linear-gradient(180deg, #efe6da, #e6dccd); border-radius: 6px 6px 18px 18px; padding: 6px; margin: 0 12% 10px; }
    .vip-row { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .sides { display: flex; }
    .side { flex: 1; display: grid; gap: 4px; align-content: start; }
    .aisle { width: 14px; margin: 0 5px; background: repeating-linear-gradient(180deg, var(--border) 0 6px, transparent 6px 12px) center / 1px 100% no-repeat; }
    .t { aspect-ratio: 1; border-radius: 50%; background: var(--white); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.52rem; color: #a99f92; min-width: 0; }
    .vip-row .t { width: 30px; border-color: #e2cc9c; background: #fffaf0; }
    .t.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; transform: scale(1.4); position: relative; z-index: 1; animation: pulse 1.8s ease-in-out infinite; }
    .vip-row .t.on { background: var(--gold); border-color: var(--gold); }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px rgba(139,110,90,0.25); } 50% { box-shadow: 0 0 0 9px rgba(139,110,90,0.06); } }
    .free-room { position: relative; width: 100%; background: var(--white); border: 1px solid var(--border); border-radius: 8px; }
    .fr-item { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.5rem; color: var(--accent-dark); border-radius: 4px; overflow: hidden; padding: 1px; }
    .fr-stage { background: linear-gradient(180deg, #efe6da, #e3d7c6); letter-spacing: 0.3em; font-size: 0.6rem; border-radius: 4px 4px 12px 12px; }
    .fr-pillar { background: #8a8178; color: #fff; }
    .fr-buffet { background: #e8f0e1; color: #4f7343; }
    .fr-door { border: 1px dashed var(--accent-soft); color: var(--accent); }
    .fr-aisle { background: repeating-linear-gradient(180deg, #f6f1ea 0 6px, #fbf8f4 6px 12px); color: transparent; }
    .fr-desk { background: #e8eef6; color: #3e5b80; }
    .fr-dance { background: #faf3e6; color: var(--gold); }
    .fr-label { color: var(--text-muted); }
    .fr-t { position: absolute; display: flex; align-items: center; justify-content: center; }
    .fr-t .t { width: 80%; font-size: 0.42rem; }
    .legend { display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--text-muted); margin-top: 8px; padding: 0 4px; }

    .mates { margin-top: 18px; text-align: center; }
    .mates h3 { font-family: 'Playfair Display', serif; font-weight: 400; font-style: italic; font-size: 1rem; color: var(--accent); margin-bottom: 8px; }
    .mates .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .mates .chips span { font-size: 0.78rem; border: 1px solid var(--border-soft); background: var(--cream); border-radius: 999px; padding: 4px 12px; }

    /* Check-in */
    .checkin { margin-top: 18px; text-align: center; }
    .ci-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 320px; padding: 15px 20px; border-radius: 999px; border: none;
      background: linear-gradient(180deg, #957660, var(--accent-dark)); color: #fff; font: 500 1.05rem 'Sarabun', sans-serif; letter-spacing: 0.02em; cursor: pointer;
      box-shadow: 0 6px 18px rgba(107, 81, 68, 0.28); transition: transform 0.15s, box-shadow 0.15s; }
    .ci-btn:active { transform: scale(0.98); }
    .ci-btn:disabled { opacity: 0.6; }
    .ci-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }
    .ci-done { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 26px; border-radius: 16px; background: #eef4ea; border: 1px solid #cfe0c6; color: #4f7343; }
    .ci-done b { font-size: 1.05rem; font-weight: 600; }
    .ci-done small { font-size: 0.75rem; color: #6a8f5c; }
    .linkish { background: none; border: none; font: inherit; font-size: 0.78rem; color: var(--text-muted); text-decoration: underline; cursor: pointer; margin-top: 8px; padding: 4px; }
    .badge .ok { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: #6a8f5c; color: #fff; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
    .badge { position: relative; }
    .welcome { text-align: center; font-family: 'Playfair Display', serif; font-style: italic; color: var(--accent); font-size: 1.05rem; margin-top: 6px; }
    .welcome + .linkish { display: block; margin: 0 auto; }

    .kiosk-tag { display: inline-block; margin-top: 10px; font-size: 0.72rem; color: var(--accent-dark); background: var(--beige); border-radius: 999px; padding: 3px 12px; }
    .kiosk-tag[hidden] { display: none; }
    /* Bigger touch targets on a shared tablet */
    body.kiosk .wrap { max-width: 640px; }
    body.kiosk .field input { font-size: 1.3rem; padding: 20px 56px 20px 56px; }
    body.kiosk .res { padding: 18px 18px 18px 22px; }
    body.kiosk .res .name { font-size: 1.15rem; }

    footer { text-align: center; margin-top: 36px; color: var(--text-muted); font-size: 0.78rem; line-height: 1.8; }
    footer .sig { font-family: 'Playfair Display', serif; font-style: italic; color: var(--accent); font-size: 0.95rem; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="assets/logo-sm.png" alt="MJ" width="96" height="98" />
      <div class="names">Madchimapon &amp; Sirathee</div>
      <div class="date">20 December 2026 · Taksila Hotel</div>
      <div class="divider"></div>
      <h1>ค้นหาโต๊ะของคุณ<em>Find your table</em></h1>
      <p class="lead">พิมพ์ชื่อ ชื่อเล่น หรือชื่อกลุ่ม / หน่วยงานของคุณ</p>
      <p class="kiosk-tag" id="kioskTag" hidden>จุดค้นหาโต๊ะ · หน้าจอจะล้างเองหลังใช้งาน</p>
    </header>

    <div class="search">
      <div class="field" id="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="พิมพ์ชื่อของคุณ…" autocomplete="off" enterkeyhint="search" aria-label="ค้นหาชื่อ" />
        <button class="clear" id="clear" aria-label="ล้าง">✕</button>
      </div>
    </div>

    <div class="results" id="results"></div>
    <div class="status" id="status"><span class="orn">✧</span>กำลังโหลดผังที่นั่ง…</div>
    <div id="detail"></div>

    <footer>
      หากไม่พบชื่อ กรุณาติดต่อโต๊ะลงทะเบียนหน้างาน<br />
      <span class="sig">Thank you for celebrating with us</span>
    </footer>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let plan = null, picked = null, checkins = {};
  // The guest this phone belongs to, remembered after they check in or tap "this is me"
  const ME_KEY = 'wedding_find_me';
  // Kiosk mode (find.html?kiosk) is for a shared tablet at the entrance: nobody is
  // remembered, and the screen clears itself after a check-in or when left idle.
  const KIOSK = new URLSearchParams(location.search).has('kiosk');
  const getMe = () => { if (KIOSK) return null; try { return localStorage.getItem(ME_KEY); } catch { return null; } };
  const setMe = (id) => { if (KIOSK) return; try { id ? localStorage.setItem(ME_KEY, id) : localStorage.removeItem(ME_KEY); } catch {} };
  const hhmm = (iso) => new Date(iso).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

  const IDLE = `<span class="orn">✧ ✧ ✧</span>ยินดีต้อนรับสู่งานของเรา<br>เริ่มพิมพ์ชื่อด้านบนเพื่อดูโต๊ะของคุณ
    <div class="hint-chips"><span>ชื่อเล่น</span><span>ชื่อ-นามสกุล</span><span>ชื่อหน่วยงาน</span></div>`;

  // Same numbering as the seating planner: VIP tables and regular tables are each
  // numbered by position; regular tables split into a left and right side.
  function prepare(s) {
    const list = Array.isArray(s.tableList) ? s.tableList
      : Array.from({ length: s.tableCount || 90 }, (_, i) => ({ id: i + 1, vip: false }));
    const vip = list.filter((t) => t.vip), reg = list.filter((t) => !t.vip);
    const label = {};
    vip.forEach((t, i) => (label[t.id] = { short: `VIP ${i + 1}`, vip: true, name: t.name }));
    reg.forEach((t, i) => (label[t.id] = { short: String(i + 1), vip: false, name: t.name }));
    const L = Object.assign({ perRow: 5, left: null }, s.layout);
    const leftN = Math.min(reg.length, L.left ?? Math.ceil(reg.length / 2));
    // Free-form room from the planner: tables keep their grid cell, plus room items
    const free = L.mode === 'free' && s.room ? { ...s.room, tables: list.filter((t) => t.pos && t.pos.x < s.room.cols && t.pos.y < s.room.rows) } : null;
    return { guests: s.guests || [], vip, left: reg.slice(0, leftN), right: reg.slice(leftN), cols: Math.max(1, L.perRow), label, free };
  }

  async function load() {
    try {
      const [sRes, cRes] = await Promise.all([
        fetch('/api/seating', { cache: 'no-store' }),
        fetch('/api/checkin', { cache: 'no-store' }).catch(() => null),
      ]);
      const { seating } = await sRes.json();
      if (!seating) throw new Error('empty');
      try { checkins = (await cRes.json()).checkins || {}; } catch {}
      const keep = picked && (picked.id || picked.name);
      plan = prepare(seating);
      search();
      // Keep the guest's result open across background refreshes
      const again = keep && plan.guests.find((g) => (g.id || g.name) === keep);
      if (again) show(again, false);
      else if (!$('q').value.trim()) showMe();
    } catch {
      if (!plan) $('status').innerHTML = '<span class="orn">✧</span>ยังโหลดผังที่นั่งไม่ได้<br>กรุณาลองใหม่อีกครั้ง หรือติดต่อโต๊ะลงทะเบียน';
    }
  }

  // Matched without spaces; a title typed in front ("พี่ต่าย", "คุณสมชาย") is optional
  const TITLE = /^(คุณ|นางสาว|นาง|นาย|ดร\.|อ\.|พี่|น้อง)/;
  const norm = (x) => String(x || '').toLowerCase().replace(/\s+/g, '');
  function search() {
    if (!plan) return;
    const raw = $('q').value.trim();
    $('field').classList.toggle('has', !!raw);
    picked = null;
    $('detail').innerHTML = '';
    if (!raw) { $('results').innerHTML = ''; $('status').innerHTML = IDLE; return; }
    const q = norm(raw), qBare = q.replace(TITLE, '') || q;
    const score = (g) => {
      const n = norm(g.name), grp = norm(g.group);
      if (n === q) return 0;
      if (n.startsWith(q)) return 1;
      if (n.includes(q)) return 2;
      if (n.includes(qBare)) return 3;
      if (grp.includes(q)) return 4;
      return -1;
    };
    const hits = plan.guests.map((g) => [score(g), g]).filter(([s]) => s >= 0)
      .sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, 'th')).slice(0, 30).map(([, g]) => g);
    $('status').innerHTML = hits.length ? '' : '<span class="orn">✧</span>ไม่พบชื่อนี้<br>ลองพิมพ์ชื่อเล่น หรือชื่อกลุ่ม / หน่วยงาน';
    $('results').innerHTML = hits.map((g, i) => {
      const l = g.table != null && plan.label[g.table];
      const badge = l
        ? `<div class="badge${l.vip ? ' vip' : ''}"><small>${l.vip ? 'TABLE' : 'โต๊ะที่'}</small><b>${esc(l.short)}</b>${checkins[g.id] ? '<span class="ok">✓</span>' : ''}</div>`
        : '<div class="badge none"><span>ติดต่อ<br>หน้างาน</span></div>';
      return `<button class="res" data-i="${i}" style="animation-delay:${Math.min(i, 8) * 30}ms">
        <div class="who"><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.group || '')}${g.count > 1 ? ` · ${g.count} ท่าน` : ''}</div></div>
        ${badge}
      </button>`;
    }).join('');
    $('results').onclick = (e) => {
      const b = e.target.closest('.res');
      if (!b) return;
      document.querySelectorAll('.res.active').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      show(hits[+b.dataset.i]);
    };
    if (hits.length === 1) { $('results').firstElementChild.classList.add('active'); show(hits[0]); }
  }

  function show(g, scroll = true) {
    picked = g;
    const l = g.table != null && plan.label[g.table];
    if (!l) { $('detail').innerHTML = ''; return; }
    // Seats around the table: the guest's party is highlighted
    const party = plan.guests.filter((x) => x.table === g.table);
    const total = Math.max(8, party.reduce((s, x) => s + x.count, 0));
    let k = 0, mine = [];
    party.forEach((x) => { for (let i = 0; i < x.count; i++) { if (x === g) mine.push(k); k++; } });
    const seats = Array.from({ length: total }, (_, i) => {
      const a = (i / total) * 360 - 90;
      return `<span class="seat${mine.includes(i) ? ' you' : ''}" style="transform:rotate(${a}deg) translate(74px) rotate(${-a}deg)"></span>`;
    }).join('');
    const t = (x) => `<div class="t${x.id === g.table ? ' on' : ''}">${esc(plan.label[x.id].short.replace('VIP ', 'V'))}</div>`;
    const mates = party.filter((x) => x !== g).map((x) => x.name);
    let side = plan.left.some((x) => x.id === g.table) ? 'ฝั่งซ้ายของทางเดิน' : plan.right.some((x) => x.id === g.table) ? 'ฝั่งขวาของทางเดิน' : 'แถวหน้าสุดหน้าเวที';
    let roomHtml = `
          <div class="stage">เวที</div>
          ${plan.vip.length ? `<div class="vip-row">${plan.vip.map(t).join('')}</div>` : ''}
          <div class="sides">
            <div class="side" style="grid-template-columns:repeat(${plan.cols},1fr)">${plan.left.map(t).join('')}</div>
            <div class="aisle"></div>
            <div class="side" style="grid-template-columns:repeat(${plan.cols},1fr)">${plan.right.map(t).join('')}</div>
          </div>
          <div class="legend"><span>ฝั่งซ้าย</span><span>ทางเดิน</span><span>ฝั่งขวา</span></div>`;
    if (plan.free) {
      // Draw the real room to scale; position everything in % of the room
      const F = plan.free, pct = (v, n) => (v / n) * 100;
      const me = F.tables.find((x) => x.id === g.table);
      const stage = F.items.find((it) => it.type === 'stage');
      if (me) {
        const row = me.pos.y - (stage ? stage.y + stage.h : 0) + 1;
        side = `${row >= 1 ? `แถวที่ ${row} จากเวที · ` : ''}${me.pos.x < F.cols / 2 ? 'ฝั่งซ้าย' : 'ฝั่งขวา'}`;
      } else side = 'ตำแหน่งโต๊ะยังไม่ได้วางในผัง';
      roomHtml = `<div class="free-room" style="padding-top:${pct(F.rows, F.cols)}%">
          ${F.items.map((it) => `<div class="fr-item fr-${esc(it.type)}" style="left:${pct(it.x, F.cols)}%;top:${pct(it.y, F.rows)}%;width:${pct(it.w, F.cols)}%;height:${pct(it.h, F.rows)}%"><span>${esc(it.label || '')}</span></div>`).join('')}
          ${F.tables.map((x) => `<div class="fr-t" style="left:${pct(x.pos.x, F.cols)}%;top:${pct(x.pos.y, F.rows)}%;width:${pct(1, F.cols)}%;height:${pct(1, F.rows)}%">${t(x)}</div>`).join('')}
        </div>`;
    }
    $('detail').innerHTML = `
      <div class="card">
        <div class="eyebrow">Your table</div>
        <div class="table-hero${l.vip ? ' vip' : ''}">${seats}<div class="top"><small>${l.vip ? 'VIP' : 'Table'}</small><b>${esc(l.vip ? l.short.replace('VIP ', '') : l.short)}</b></div></div>
        <div class="who-line">${esc(g.name)}${g.count > 1 ? ` · ${g.count} ท่าน` : ''}</div>
        <div class="where">${side} · หันหน้าเข้าเวที</div>
        ${l.name ? `<div class="tname"><span>${esc(l.name)}</span></div>` : ''}
        <div class="checkin" id="ci">${checkinBlock(g)}</div>
        <div class="room">
          <div class="room-title">ตำแหน่งในห้องจัดเลี้ยง</div>
          ${roomHtml}
        </div>
        ${mates.length ? `<div class="mates"><h3>นั่งร่วมโต๊ะกับ</h3><div class="chips">${mates.slice(0, 10).map((m) => `<span>${esc(m)}</span>`).join('')}${mates.length > 10 ? `<span>+${mates.length - 10}</span>` : ''}</div></div>` : ''}
      </div>`;
    if (scroll) $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function checkinBlock(g) {
    const at = checkins[g.id];
    if (at) {
      return `<div class="ci-done"><b>✓ เช็กอินแล้ว</b><small>เวลา ${hhmm(at)} น.</small></div><br>
        <button class="linkish" data-ci="undo">ยกเลิกเช็กอิน</button>`;
    }
    return `<button class="ci-btn" data-ci="in">✓ ฉันได้ที่นั่งแล้ว</button>
      <div class="ci-note">กดเมื่อถึงงานและนั่งที่โต๊ะแล้ว${KIOSK || getMe() === g.id ? '' : ' · ระบบจะจำชื่อคุณไว้ในเครื่องนี้'}</div>`;
  }
  $('detail').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-ci]');
    if (!b || !picked) return;
    if (b.dataset.ci === 'forget') { setMe(null); $('q').value = ''; search(); $('q').focus(); return; }
    const g = picked, undo = b.dataset.ci === 'undo';
    b.disabled = true;
    try {
      const res = await fetch('/api/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: g.id, undo }) });
      if (!res.ok) throw new Error();
      const { at } = await res.json();
      if (at) { checkins[g.id] = at; setMe(g.id); } else delete checkins[g.id];
      $('ci').innerHTML = checkinBlock(g);
      if (KIOSK && at) resetSoon(8000);
    } catch {
      b.disabled = false;
      $('ci').insertAdjacentHTML('beforeend', '<div class="ci-note">บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง</div>');
    }
  });
  // Returning on the same phone: go straight to "your" table
  function showMe() {
    const me = getMe(), g = me && plan.guests.find((x) => x.id === me);
    if (!g) return;
    $('status').innerHTML = `<div class="welcome">ยินดีต้อนรับกลับ ✧</div>`;
    show(g, false);
    $('detail').insertAdjacentHTML('beforeend', '<div style="text-align:center"><button class="linkish" data-ci="forget">ไม่ใช่คุณ? ค้นหาชื่ออื่น</button></div>');
  }

  let timer;
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 150); });
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });
  $('clear').addEventListener('click', () => { $('q').value = ''; search(); $('q').focus(); });
  // Pick up last-minute changes if the page stays open (e.g. on a kiosk)
  setInterval(load, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  // Kiosk: back to an empty search for the next guest
  let idleTimer;
  function resetNow() {
    $('q').value = '';
    search();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function resetSoon(ms) { clearTimeout(idleTimer); idleTimer = setTimeout(resetNow, ms); }
  if (KIOSK) {
    document.body.classList.add('kiosk');
    $('kioskTag').hidden = false;
    ['pointerdown', 'keydown', 'input', 'scroll'].forEach((ev) => document.addEventListener(ev, () => { if ($('q').value) resetSoon(60000); }, { passive: true }));
  }

  load();
})();
</script>
</body>
</html>
